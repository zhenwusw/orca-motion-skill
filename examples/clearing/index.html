<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clearing · orca-motion-skill 示例</title>
  <!-- T = orca-transition-skill 的位置（两个 skill 装在同一层目录）-->
  <link rel="stylesheet" href="../../../orca-transition-skill/node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../../../orca-transition-skill/node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../../orca-transition-skill/runtime/tokens.css">
  <link rel="stylesheet" href="../../../orca-transition-skill/runtime/themes/clearing.css">
  <link rel="stylesheet" href="../../runtime/motion.css">
</head>
<body>
<div class="reveal">

<!-- 故事（主角：一段被空出来的时间，黄色）
场景 1  year   全年热力图：格子从左往右亮起，统计滚到 2,184 个日程、0 小时空闲。最后圈出一天
场景 2  day    那一天的时间轴（第 0 秒日程已排满）：扫描线走到 15:00，发现 30 分钟空档，镜头推近，黄色卡片「Clear.」弹出
场景 3  outro  回到全年：那一天已经是黄格子；更多黄格子拼出 CLEARING，统计翻成 63.5 小时被保留，标语

转场计划
1→2  关系：圈出的那一格里面就是这一天          手法：放大进元素内部（in）   元素：day
2→3  关系：这一天缩回全年里的那一格（已经变黄）  手法：放大进元素内部（out）  元素：day
-->

<div class="slides">

  <section data-hold="1">
    <div class="mo-scene" data-scene="year">
      <script type="application/json">{ "mode": "intro", "year": 2027, "events": 2184, "day": [3, 51] }</script>
    </div>
  </section>

  <section data-st="zoom-into" data-st-direction="in" data-st-from="day" data-st-duration="1.3" data-hold="1">
    <div class="mo-scene" data-scene="day">
      <script type="application/json">{
        "hours": [8, 19],
        "free": { "start": "15:00", "end": "15:30" },
        "events": [
          { "title": "Design crit", "start": "8:00", "end": "9:30" },
          { "title": "All hands", "start": "10:00", "end": "11:30" },
          { "title": "Offsite prep", "start": "11:30", "end": "13:30" },
          { "title": "Board deck", "start": "13:30", "end": "15:00" },
          { "title": "Design crit", "start": "15:30", "end": "16:30" },
          { "title": "Pricing", "start": "16:30", "end": "17:30" },
          { "title": "Budget", "start": "17:30", "end": "18:30" },
          { "title": "Offsite prep", "start": "18:30", "end": "19:00" }
        ]
      }</script>
    </div>
  </section>

  <section data-st="zoom-into" data-st-direction="out" data-st-to="day" data-st-duration="1.3" data-hold="5">
    <div class="mo-scene" data-scene="year">
      <script type="application/json">{ "mode": "outro", "year": 2027, "events": 2184, "day": [3, 51], "word": "CLEARING", "kept": 63.5 }</script>
    </div>
  </section>

</div>
</div>

<script src="../../../orca-transition-skill/node_modules/reveal.js/dist/reveal.js"></script>
<script src="../../../orca-transition-skill/node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../runtime/motion.js"></script>
<script>
  // 固定种子的伪随机数：每次生成同样的热力图
  const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);

  // ── 场景：全年热力图（intro：亮起；outro：拼字收尾）──
  OrcaMotion.scene("year", ({ el, tl, m, data }) => {
    const ROWS = 7, COLS = 53, CELL = 24, GAP = 7;
    const gridW = COLS * (CELL + GAP) - GAP;
    const X = (1920 - gridW) / 2;
    const Y = 470;
    m.backdrop();
    const rand = rng(7);
    const levels = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => (rand() < 0.08 ? 1 : 2 + Math.floor(rand() * 3))));

    const title = m.add("mo-t-l", { x: X, y: 340 }, String(data.year));
    const stats = m.add("mo-t-xs", { x: X + 190, y: 380 }, "");
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
      .map((mo, i) => m.add("mo-t-xs", { x: X + Math.round((i * COLS) / 12) * (CELL + GAP), y: Y - 34 }, mo));
    const weekdays = [["Mon", 1], ["Wed", 3], ["Fri", 5]]
      .map(([d, r]) => m.add("mo-t-xs", { x: X - 64, y: Y + r * (CELL + GAP) + 4, w: 48 }, d));
    weekdays.forEach((w) => { w.style.textAlign = "right"; });

    const grid = m.grid({ x: X, y: Y, rows: ROWS, cols: COLS, cell: CELL, gap: GAP, levels });
    const [dr, dc] = data.day;
    const day = grid.at(dr, dc);
    day.dataset.zoom = "day";
    const statText = (n, tail) => `${n} events · ${tail}`;

    if (data.mode === "intro") {
      m.rise(title, 0);
      months.forEach((n) => m.fade(n, 0.15));
      weekdays.forEach((n) => m.fade(n, 0.15));
      const end = m.appear(grid.cells, { at: 0.2, origin: "left", span: 1.0, kind: "pop", duration: 0.3 });
      m.fade(stats, 0.2);
      m.count(stats, { at: 0.2, from: 0, to: data.events, duration: 1.2, format: (s) => statText(s, "0 hours free") });
      // 圈出那一天：虚线框弹出
      const b = grid.box(dr, dc);
      const ring = m.add("mo-dash", { x: b.x - 7, y: b.y - 7, w: b.w + 14, h: b.h + 14 });
      m.pop(ring, end + 0.05, 0.35);
      m.hold(end + 0.4 + 0.2);
    } else {
      // 收尾：所有格子已经在，那一天已经是黄色
      stats.textContent = statText(data.events.toLocaleString("en-US"), "0 hours free");
      day.classList.add("mo-hot");
      m.spell(grid, data.word, { at: 0.3, row: 0, col: 3, each: 0.03 });
      const spelled = 0.3 + 47 * 0.03 + 0.3;
      m.swapText(stats, statText(data.events.toLocaleString("en-US"), "0.0 hours kept"), spelled, 0.3);
      m.count(stats, { at: spelled + 0.3, from: 0, to: data.kept, decimals: 1, duration: 0.8,
        format: (s) => statText(data.events.toLocaleString("en-US"), `${s} hours kept`) });
      const tag = m.add("mo-t-m", { x: 0, y: 760, w: 1920 }, "Room, found in a full year.");
      tag.style.textAlign = "center";
      const sub = m.add("mo-t-xs", { x: 0, y: 824, w: 1920 }, "clearing · a calendar that keeps time free");
      sub.style.textAlign = "center";
      m.rise(tag, spelled + 0.6, 0.5);
      m.rise(sub, spelled + 0.8, 0.5);
    }
  });

  // ── 场景：那一天 ──
  // 这个场景由 zoom-into 推进来：转场拍到的是第 0 秒的画面，所以第 0 秒就是排满的一天，
  // 「建立」由转场完成，场景一开始直接进「发生」（扫描线）
  OrcaMotion.scene("day", ({ el, tl, m, data }) => {
    m.backdrop();
    const world = m.world();
    const PX = 600, PY = 70, PW = 720, PH = 940;
    const agendaOf = (x, events) => m.agenda({ x: x + 24, y: PY + 50, w: PW - 60, hourH: 76, hours: data.hours, events, parent: world });
    // 左右两天只露出一部分，说明这是「一周里的一天」。也排满日程（固定种子生成），推进时画面不空
    const rand = rng(11);
    const [h0, h1] = data.hours;
    const fillDay = () => {
      const evs = [];
      for (let h = h0; h < h1; ) {
        const len = Math.min(h1 - h, 1 + Math.floor(rand() * 3) * 0.5);
        evs.push({ title: data.events[Math.floor(rand() * data.events.length)].title, start: `${Math.floor(h)}:${h % 1 ? "30" : "00"}`, end: `${Math.floor(h + len)}:${(h + len) % 1 ? "30" : "00"}` });
        h += len;
      }
      return evs;
    };
    for (const x of [-360, 1560]) {
      const side = m.add("mo-panel", { x, y: PY, w: PW, h: PH }, null, world);
      side.style.opacity = 0.55;
      const sag = agendaOf(x, fillDay());
      [...sag.blocks, ...sag.labels].forEach((n) => { n.style.opacity = 0.55; });
      m.blur([side, ...sag.blocks, ...sag.labels], 5); // 焦外：旁边的两天只交代「这是一周里的一天」
    }
    m.add("mo-panel", { x: PX, y: PY, w: PW, h: PH }, null, world);
    const ag = agendaOf(PX, data.events);

    let t = 0.2;

    // 扫描线从 8 点走到空档
    const lineX = PX + 24 + 60;
    const rule = m.add("mo-rule", { x: lineX, y: 0, w: PW - 60 - 60 }, null, world);
    const dot = m.add("mo-dot", { x: lineX - 6, y: -5, w: 12, h: 12 }, null, world);
    const y0 = ag.yOf(data.hours[0] + ":00");
    const y1 = ag.yOf(data.free.start);
    tl.set([rule, dot], { autoAlpha: 0 }, 0);
    m.scan(rule, { at: t, from: y0, to: y1, duration: 1.1 });
    m.scan(dot, { at: t, from: y0, to: y1, duration: 1.1 });
    t += 1.1;

    // 空档：虚线框 + 标注
    const slot = { x: lineX, y: y1 + 3, w: PW - 60 - 60, h: ag.yOf(data.free.end) - y1 - 6 };
    const dash = m.add("mo-dash", slot, null, world);
    const note = m.add("mo-t-xs", { x: slot.x + slot.w - 230, y: slot.y + 11, w: 220 }, `${data.free.start}–${data.free.end} · free`, world);
    note.style.textAlign = "right";
    m.pop(dash, t + 0.05, 0.35);
    m.fade(note, t + 0.15, 0.3);
    m.hide([rule, dot], t + 0.15);
    t += 0.4;

    // 镜头推近空档，其余日程退到焦外
    m.camera(world, slot, { at: t, duration: 1.0, fill: 0.62 });
    m.blur([...ag.blocks, ...ag.labels], 3, { at: t, duration: 1.0 });
    t += 0.85;

    // 黄色卡片：这段时间被留下了
    const card = m.add("mo-card", { x: slot.x + 16, y: slot.y - 10, w: 420, h: slot.h + 20 }, null, world);
    const clear = m.add("mo-t-m mo-on-accent", { x: slot.x + 32, y: slot.y - 4 }, "Clear.", world);
    const kept = m.add("mo-t-xs mo-on-accent", { x: slot.x + 170, y: slot.y + 10 }, "30 min · kept for you", world);
    m.pop(card, t, 0.4);
    m.rise(clear, t + 0.1, 0.35);
    m.reveal(kept, t + 0.35, 0.5);
    m.hold(t + 0.85 + 0.3);
  });
</script>
<script src="../../../orca-transition-skill/runtime/engine.js"></script>
</body>
</html>
